
spring.application.name=codearena-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/codearena
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Anand1124%}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

# Judge0 code execution
judge0.base-url=https://ce.judge0.com
judge0.api-key=${JUDGE0_API_KEY:}
judge0.poll-interval-ms=500
judge0.max-poll-attempts=40